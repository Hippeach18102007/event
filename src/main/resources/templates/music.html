<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tet Music Lounge - Nopro Peach</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Comfortaa', cursive; }
        .hand-font { font-family: 'Dancing Script', cursive; }

        @keyframes bounce-gold {
            0% { height: 10px; opacity: 0.6; }
            100% { height: 60px; opacity: 1; }
        }
        .music-bar {
            width: 8px;
            background: linear-gradient(to top, #FBBF24, #FEF3C7);
            border-radius: 9999px;
            animation: bounce-gold 0.8s infinite alternate;
        }

        /* Ẩn thanh cuộn nhưng vẫn cho scroll (tùy chọn cho đẹp) */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #450a0a; }
        ::-webkit-scrollbar-thumb { background: #b45309; border-radius: 4px; }
    </style>
</head>
<body class="bg-red-950 text-white min-h-screen flex flex-col items-center justify-center relative py-10 px-4">

<canvas id="apricotCanvas" class="fixed top-0 left-0 w-full h-full pointer-events-none z-0"></canvas>

<div class="relative z-10 w-full max-w-3xl bg-red-900/60 backdrop-blur-md border border-yellow-500/50 rounded-3xl shadow-[0_0_60px_rgba(234,179,8,0.25)] p-6 md:p-10 text-center my-auto">

    <div class="mb-6">
        <p class="text-yellow-200 text-sm uppercase tracking-widest opacity-80 mb-1">Đào Anh Đức aka Nopro Peach presents</p>
        <h1 class="hand-font text-4xl md:text-5xl text-yellow-400 font-bold drop-shadow-lg">
            Vũ Điệu Nhạc Xuân 2026 🐍
        </h1>
    </div>

    <div class="relative w-full aspect-video rounded-xl overflow-hidden border-4 border-yellow-600 shadow-2xl bg-black mb-6 group">
        <div id="player" class="w-full h-full"></div>
        <div id="start-overlay" class="absolute inset-0 bg-black/60 flex items-center justify-center cursor-pointer transition-opacity duration-500 hover:bg-black/40">
            <div class="text-center animate-pulse">
                <span class="text-6xl">▶️</span>
                <p class="mt-2 text-yellow-300 font-bold">Chạm để bật nhạc</p>
            </div>
        </div>
    </div>

    <div class="min-h-[4rem] flex items-center justify-center mb-4">
        <h2 id="song-title" class="text-xl md:text-2xl text-yellow-100 font-bold transition-all duration-300">
            Đang tải danh sách nhạc... 🎵
        </h2>
    </div>

    <div class="flex justify-center items-end h-16 gap-2 mb-8">
        <div class="music-bar" style="animation-delay: 0.1s"></div>
        <div class="music-bar" style="animation-delay: 0.3s"></div>
        <div class="music-bar" style="animation-delay: 0.5s"></div>
        <div class="music-bar" style="animation-delay: 0.2s"></div>
        <div class="music-bar" style="animation-delay: 0.4s"></div>
        <div class="music-bar" style="animation-delay: 0.15s"></div>
    </div>

    <div class="flex justify-center items-center gap-6 md:gap-10 mb-8">
        <button id="prev-btn" class="w-14 h-14 rounded-full border-2 border-yellow-500 text-yellow-500 hover:bg-yellow-500 hover:text-red-900 transition-all flex items-center justify-center text-2xl disabled:opacity-50">
            ⏮
        </button>

        <button id="play-pause-btn" class="w-20 h-20 rounded-full bg-gradient-to-r from-yellow-500 to-yellow-600 text-red-900 shadow-lg hover:scale-110 transition-transform flex items-center justify-center text-4xl font-bold border-4 border-red-900">
            ▶
        </button>

        <button id="next-btn" class="w-14 h-14 rounded-full border-2 border-yellow-500 text-yellow-500 hover:bg-yellow-500 hover:text-red-900 transition-all flex items-center justify-center text-2xl disabled:opacity-50">
            ⏭
        </button>
    </div>

    <div class="flex flex-wrap justify-center gap-4 border-t border-yellow-500/30 pt-6">
        <a href="/" class="px-5 py-2 rounded-full bg-red-800 hover:bg-red-700 text-yellow-100 text-sm font-bold transition-colors">
            🏠 Về trang chủ
        </a>
        <a href="/celebrate?name=Bạn&gender=male" class="px-5 py-2 rounded-full bg-yellow-600 hover:bg-yellow-500 text-white text-sm font-bold transition-colors">
            🧧 Xem lại lời chúc
        </a>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    const playlist = [
        { videoId: 'gOtfJ151ue4', title: 'Tết đông đầy' },
        { videoId: 'Vzlgc_A11P8', title: 'Ngày Tết Quê Em' }

    ];

    let player;
    let currentTrack = 0;
    let isPlaying = false;
    const songTitleEl = document.getElementById('song-title');
    const playBtn = document.getElementById('play-pause-btn');
    const nextBtn = document.getElementById('next-btn');
    const prevBtn = document.getElementById('prev-btn');
    const overlay = document.getElementById('start-overlay');

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            height: '100%', width: '100%',
            playerVars: { 'autoplay': 0, 'controls': 0, 'rel': 0, 'playsinline': 1 },
            events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
        });
    }

    function onPlayerReady(event) {
        songTitleEl.innerText = "Sẵn sàng! Nhấn Play để chill 🌸";
        player.cueVideoById(playlist[currentTrack].videoId);
    }

    function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.PLAYING) {
            isPlaying = true;
            playBtn.innerHTML = "⏸";
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);
            songTitleEl.innerText = "Đang phát: " + playlist[currentTrack].title;
        } else if (event.data === YT.PlayerState.PAUSED) {
            isPlaying = false; playBtn.innerHTML = "▶";
        } else if (event.data === YT.PlayerState.ENDED) {
            nextSong();
        }
    }

    function togglePlay() {
        if (player && player.playVideo) { isPlaying ? player.pauseVideo() : player.playVideo(); }
    }
    function nextSong() { currentTrack = (currentTrack + 1) % playlist.length; loadSong(); }
    function prevSong() { currentTrack = (currentTrack - 1 + playlist.length) % playlist.length; loadSong(); }
    function loadSong() { player.loadVideoById(playlist[currentTrack].videoId); songTitleEl.innerText = playlist[currentTrack].title; }

    playBtn.addEventListener('click', togglePlay);
    overlay.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', nextSong);
    prevBtn.addEventListener('click', prevSong);

    // Canvas Effect
    const canvas = document.getElementById('apricotCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    let flowers = [];
    const flowerColors = ['#FCD34D', '#FBBF24', '#FEF08A'];
    function createFlowers() {
        for(let i = 0; i < 100; i++) flowers.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 4 + 2, d: Math.random() * 1.5 + 0.5, color: flowerColors[Math.floor(Math.random() * flowerColors.length)], oscillation: Math.random() * 2 * Math.PI });
    }
    function drawFlowers() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for(let f of flowers) {
            ctx.fillStyle = f.color; ctx.beginPath();
            ctx.arc(f.x + Math.sin(f.oscillation) * 20, f.y, f.r, 0, Math.PI * 2); ctx.fill();
        }
        updateFlowers(); requestAnimationFrame(drawFlowers);
    }
    function updateFlowers() {
        for(let f of flowers) {
            f.y += f.d; f.oscillation += 0.02;
            if(f.y > canvas.height) { f.y = -10; f.x = Math.random() * canvas.width; }
        }
    }
    createFlowers(); drawFlowers();
    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
</script>
</body>
</html>
