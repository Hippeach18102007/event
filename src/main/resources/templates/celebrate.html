<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Năm Mới 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Comfortaa:wght@500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Comfortaa', cursive; }
        .hand-font { font-family: 'Dancing Script', cursive; }
        /* Canvas giữ nguyên fixed để làm nền khi cuộn */
        canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 0; }

        /* Animation chữ */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .float-anim { animation: float 3s ease-in-out infinite; }
    </style>
</head>

<body class="bg-red-950 text-white min-h-screen flex items-center justify-center relative py-10">

<canvas id="confetti"></canvas>

<div class="relative z-10 container mx-auto px-4 text-center">

    <div class="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-full md:-translate-y-32 w-full flex justify-center gap-20 opacity-80">
        <div class="text-6xl animate-pulse">🏮</div>
        <div class="text-6xl animate-pulse delay-700">🏮</div>
    </div>

    <div class="bg-red-900/40 backdrop-blur-md border border-yellow-500/50 p-8 md:p-12 rounded-3xl shadow-[0_0_60px_rgba(234,179,8,0.2)] max-w-3xl mx-auto transform transition hover:scale-[1.01] duration-500 my-10">

        <div class="mb-4">
            <span class="text-yellow-500 text-xl uppercase tracking-widest">Lời chúc từ</span>
            <div class="hand-font text-3xl md:text-4xl text-yellow-300 mt-2" th:text="${sender}">Sender Name</div>
        </div>

        <div class="my-8">
            <h1 class="text-2xl md:text-3xl font-light text-red-100">Gửi tặng</h1>
            <h2 class="hand-font text-5xl md:text-7xl text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-yellow-100 to-yellow-300 font-bold my-4 float-anim"
                th:text="${userName}">Tên Bạn</h2>
        </div>

        <p class="text-lg md:text-2xl leading-relaxed text-red-50 font-light italic border-t border-b border-yellow-500/30 py-6"
           th:text="${userWish}">
            Nội dung lời chúc sẽ hiện ở đây...
        </p>

        <div class="mt-8 text-6xl md:text-7xl grid grid-cols-3 gap-4 justify-center items-center opacity-90">
            <span class="transform -scale-x-100">🐎</span>
            <span class="text-4xl text-yellow-400 font-bold border-2 border-yellow-400 rounded-full w-16 h-16 flex items-center justify-center mx-auto">Tết</span>
            <span>🐎</span>
        </div>

        <div class="mt-10 flex flex-col md:flex-row gap-4 justify-center">
            <a href="/music" class="inline-block px-8 py-3 bg-red-800 hover:bg-red-700 text-yellow-100 font-bold rounded-full transition-all shadow-lg text-sm uppercase tracking-wider">
                🎵 Nghe nhạc Tết
            </a>
            <a href="/" class="inline-block px-8 py-3 bg-yellow-600 hover:bg-yellow-500 text-white font-bold rounded-full transition-all shadow-lg hover:shadow-yellow-500/50 text-sm uppercase tracking-wider">
                🎋 Chúc người khác
            </a>
            <a href="/game" class="inline-block px-8 py-3 bg-red-600 hover:bg-red-500 text-yellow-100 font-bold rounded-full ...">
                🎮 Bốc Lì Xì & Gieo Quẻ
            </a>
        </div>
    </div>
</div>

<script>
    // Hiệu ứng cánh hoa mai vàng rơi (Canvas)
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];
    const colors = ['#FCD34D', '#F59E0B', '#FDE68A', '#FFFBEB']; // Tông vàng Gold

    function createParticles() {
        for(let i = 0; i < 100; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 5 + 2,
                d: Math.random() * 2 + 1,
                color: colors[Math.floor(Math.random() * colors.length)],
                tilt: Math.floor(Math.random() * 10) - 10
            });
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for(let p of particles) {
            ctx.beginPath();
            ctx.lineWidth = p.r;
            ctx.strokeStyle = p.color;
            ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
            ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
            ctx.stroke();
        }
        update();
    }

    function update() {
        for(let p of particles) {
            p.tilt += Math.random() * 0.5 - 0.25; // Hiệu ứng lắc lư
            p.y += Math.pow(p.d, 1.5) + 1; // Rơi xuống

            // Reset khi chạm đáy
            if(p.y > canvas.height) {
                p.x = Math.random() * canvas.width;
                p.y = -10;
            }
        }
    }

    createParticles();
    setInterval(draw, 20);

    // Resize window handle
    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
</script>

</body>
</html>
