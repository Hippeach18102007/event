<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Năm Mới 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Comfortaa:wght@500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Comfortaa', cursive; }
        .hand-font { font-family: 'Dancing Script', cursive; }
        /* Canvas giữ nguyên fixed để làm nền khi cuộn */
        canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 0; }

        /* Animation chữ */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .float-anim { animation: float 3s ease-in-out infinite; }
    </style>
</head>

<body class="bg-red-950 text-white min-h-screen flex items-center justify-center relative py-10">

<canvas id="confetti"></canvas>

<div class="relative z-10 container mx-auto px-4 text-center">

    <div class="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-full md:-translate-y-32 w-full flex justify-center gap-20 opacity-80">
        <div class="text-6xl animate-pulse">🏮</div>
        <div class="text-6xl animate-pulse delay-700">🏮</div>
    </div>

    <div class="bg-red-900/40 backdrop-blur-md border border-yellow-500/50 p-8 md:p-12 rounded-3xl shadow-[0_0_60px_rgba(234,179,8,0.2)] max-w-3xl mx-auto transform transition hover:scale-[1.01] duration-500 my-10">

        <div class="mb-4">
            <span class="text-yellow-500 text-xl uppercase tracking-widest">Lời chúc từ</span>
            <div class="hand-font text-3xl md:text-4xl text-yellow-300 mt-2" th:text="${sender}">Sender Name</div>
        </div>

        <div class="my-8">
            <h1 class="text-2xl md:text-3xl font-light text-red-100">Gửi tặng</h1>
            <h2 class="hand-font text-5xl md:text-7xl text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-yellow-100 to-yellow-300 font-bold my-4 float-anim"
                th:text="${userName}">Tên Bạn</h2>
        </div>

        <p class="text-lg md:text-2xl leading-relaxed text-red-50 font-light italic border-t border-b border-yellow-500/30 py-6"
           th:text="${userWish}">
            Nội dung lời chúc sẽ hiện ở đây...
        </p>

        <div class="mt-8 text-6xl md:text-7xl grid grid-cols-3 gap-4 justify-center items-center opacity-90">
            <span class="transform -scale-x-100">🐎</span>
            <span class="text-4xl text-yellow-400 font-bold border-2 border-yellow-400 rounded-full w-16 h-16 flex items-center justify-center mx-auto">Tết</span>
            <span>🐎</span>
        </div>

        <div class="mt-10 flex flex-col md:flex-row gap-4 justify-center">
            <a href="/music" class="inline-block px-8 py-3 bg-red-800 hover:bg-red-700 text-yellow-100 font-bold rounded-full transition-all shadow-lg text-sm uppercase tracking-wider">
                🎵 Nghe nhạc Tết
            </a>
            <a href="/" class="inline-block px-8 py-3 bg-yellow-600 hover:bg-yellow-500 text-white font-bold rounded-full transition-all shadow-lg hover:shadow-yellow-500/50 text-sm uppercase tracking-wider">
                🎋 Chúc người khác
            </a>
            <a href="/game" class="inline-block px-8 py-3 bg-red-600 hover:bg-red-500 text-yellow-100 font-bold rounded-full ...">
                🎮 Bốc Lì Xì & Gieo Quẻ
            </a>
        </div>
    </div>
</div>

<script>
    // Cấu hình tỉ lệ trúng thưởng
    const prizeList = [
        { value: "500.000đ", weight: 1 },  // 1%
        { value: "200.000đ", weight: 4 },  // 4%
        { value: "100.000đ", weight: 10 }, // 10%
        { value: "50.000đ",  weight: 15 }, // 15%
        { value: "30.000đ",  weight: 20 }, // 20%
        { value: "20.000đ",  weight: 25 }, // 25%
        { value: "10.000đ",  weight: 25 }  // 25%
    ];

    const fortunes = [
        "Tiền vào cửa trước, vàng vào cửa sau, hai cái gặp nhau chui vào két sắt.",
        "Năm nay tình duyên phơi phới, cẩn thận kẻo người yêu cũ mời cưới.",
        "Sự nghiệp thăng tiến vùn vụt như ngựa Bính Ngọ phi nước đại.",
        "Ăn được ngủ được là tiên, năm nay chắc chắn có nhiều tiền tiêu.",
        "Ra đường gặp quý nhân, về nhà gặp thần tài.",
        "Số đỏ như son, làm gì cũng thắng, chơi gì cũng hay.",
        "Cẩn thận cân nặng, năm nay lộc ăn hơi nhiều đấy!"
    ];

    // Biến cờ để kiểm tra xem đã chơi chưa
    let hasPlayed = false;

    // Hàm chọn quà random
    function getLuckyMoney() {
        let totalWeight = 0;
        prizeList.forEach(item => totalWeight += item.weight);
        let randomNum = Math.random() * totalWeight;
        let weightSum = 0;
        for (let item of prizeList) {
            weightSum += item.weight;
            if (randomNum <= weightSum) return item.value;
        }
        return "10.000đ";
    }

    // Tạo lưới bao lì xì
    const grid = document.getElementById('grid-lixi');
    for (let i = 0; i < 8; i++) {
        const div = document.createElement('div');
        // Thêm id để dễ xử lý nếu cần, thêm style cursor
        div.className = 'envelope bg-red-600 border-2 border-yellow-400 h-32 md:h-40 rounded-xl flex items-center justify-center shadow-lg relative overflow-hidden group select-none';

        // Gắn sự kiện click
        div.onclick = function() { openLixi(this) };

        div.innerHTML = `
                <div class="text-5xl md:text-6xl group-hover:scale-110 transition-transform">🧧</div>
                <div class="absolute bottom-2 text-yellow-200 text-xs font-bold">Bốc Đi</div>
            `;
        grid.appendChild(div);
    }

    // Xử lý khi mở lì xì
    function openLixi(element) {
        // 1. Kiểm tra nếu đã mở rồi thì chặn luôn
        if (hasPlayed) return;

        // Đánh dấu là đã chơi
        hasPlayed = true;

        // 2. Vô hiệu hóa TOÀN BỘ lưới lì xì ngay lập tức
        // Thêm class pointer-events-none và opacity để người dùng biết là không bấm được nữa
        const allEnvelopes = document.querySelectorAll('.envelope');
        allEnvelopes.forEach(env => {
            env.classList.add('opacity-50', 'pointer-events-none'); // Làm mờ tất cả
        });

        // Riêng cái vừa bấm thì làm sáng lại (để biết mình chọn cái nào)
        element.classList.remove('opacity-50');
        element.classList.add('opened', 'ring-4', 'ring-yellow-300'); // Thêm viền sáng

        // 3. Random kết quả
        const money = getLuckyMoney();
        const fortune = fortunes[Math.floor(Math.random() * fortunes.length)];

        // 4. Điền dữ liệu vào Modal
        document.getElementById('money-display').innerText = money;
        document.getElementById('que-text').innerText = fortune;

        // 5. Điền vào input ẩn
        document.getElementById('luckyMoneyInput').value = money;
        document.getElementById('luckyNoteInput').value = fortune;

        // 6. Hiện Modal sau 500ms (để người dùng kịp nhìn hiệu ứng click)
        setTimeout(() => {
            document.getElementById('result-modal').classList.remove('hidden');
        }, 500);
    }

    function closeModal() {
        // Chỉ đóng modal, nhưng biến hasPlayed vẫn là true nên không click lại được
        document.getElementById('result-modal').classList.add('hidden');
    }
</script>

</body>
</html>
