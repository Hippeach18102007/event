spring.application.name=event

# C?u hình c?ng m?ng (Quan tr?ng ?? ch?y trên Render/Railway/Heroku)
# N?u server c?p bi?n PORT thì dùng, không thì dùng 8080
server.port=${PORT:8080}

# C?u hình Gmail (Dùng bi?n môi tr??ng ?? b?o m?t)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=20000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000

spring.mail.properties.mail.smtp.ssl.trust=*